<!doctype html>
<html lang="uk">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Форма додавання новини на навчальний портал групи П-425.">
        <link rel="stylesheet" href="styles/main.css">
        <title>Додати новину — Навчальний портал</title>
    </head>
    <body>
        <header>
            <div class="header-body">
                <img
                    src="images/logo.png"
                    alt="Логотип коледжу»"
                    width="100"
                >
            
                <h1>БФКПЕП</h1>
            
                <nav aria-label="Основна навігація">
                    <ul>
                        <li><a href="index.html#about">Про коледж</a></li>
                        <li><a href="index.html#schedule">Розклад</a></li>
                        <li><a href="index.html#news">Новини</a></li>
                        <li><a href="index.html#contacts">Контакти</a></li>
                        <li><a href="login.html">Увійти</a></li>
                        <li><a href="register.html">Реєстрація</a></li>
                        <li><a href="news-form.html">Додати новину</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main id="main-content" style="width: 500px;">
            <section>
                <h2>Форма додавання новини</h2>
                <p>Заповніть дані новини.</p>

                <form action="/news" method="post">
                    <div>
                        <label for="news-title">Назва новини</label>
                        <input id="news-title" name="title" type="text" minlength="3" maxlength="80" aria-describedby="news-title-hint" required>
                    </div>

                    <div>
                        <label for="news-description">Текст новини</label>
                        <textarea id="news-description" name="description" minlength="10" maxlength="1000" rows="8" aria-describedby="news-description-hint" required></textarea>
                    </div>

                    <div>
                        <label for="news-category">Категорія новини</label>
                        <select id="news-category" name="category" required>
                            <option value="">Оберіть категорію</option>
                            <option value="education">Навчання</option>
                            <option value="events">Події</option>
                            <option value="announcements">Оголошення</option>
                            <option value="sport">Спорт</option>
                        </select>
                    </div>

                    <div>
                        <label for="news-date">Дата публікації</label>
                        <input id="news-date" name="publicationDate" type="date" required>
                    </div>
                    <div class="form-group">
                        <p class="group-title">Видимість новини</p>

                        <div class="option-list">
                            <label class="option-item">
                                <input type="radio" name="visibility" value="all" checked>
                                <span>Усі відвідувачі</span>
                            </label>

                            <label class="option-item">
                                <input type="radio" name="visibility" value="registered">
                                <span>Лише зареєстровані користувачі</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <p class="group-title">Додаткові параметри</p>

                        <div class="option-list">
                            <label class="option-item">
                                <input type="checkbox" name="comments" value="allowed">
                                <span>Дозволити коментарі</span>
                            </label>

                            <label class="option-item">
                                <input type="checkbox" name="featured" value="yes">
                                <span>Позначити як важливу</span>
                            </label>

                            <label class="option-item">
                                <input type="checkbox" name="notification" value="yes">
                                <span>Відобразити при відвідуванні сайту</span>
                            </label>
                        </div>
                    </div>
                    <button type="submit">Опублікувати новину</button>
                    <a href="index.html" class="register-link">Скасувати</a>
                </form>
            </section>
        </main>

        <footer><p>&copy; 2026 БФКПЕП</p></footer>
    </body>
</html>
